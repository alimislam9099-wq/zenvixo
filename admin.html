<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenvixo Admin Panel</title>
<style>
#zenAdminLauncher{position:fixed;left:14px;bottom:18px;z-index:99990;border:0;border-radius:999px;padding:12px 17px;background:linear-gradient(135deg,#102f69,#1678e8);color:#fff;font-weight:900;box-shadow:0 8px 25px #073b8b55;font-size:13px}
#zenAdminShell{display:none;position:fixed;inset:0;z-index:99999;background:#f3f6fb;color:#17243b;font-family:Arial,sans-serif;overflow:auto}
#zenAdminShell *{box-sizing:border-box}
.za-login-wrap{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#d8eaff,#f4f7fc 55%)}
.za-login{width:min(100%,390px);background:#fff;border:1px solid #e5edf8;border-radius:24px;padding:28px;box-shadow:0 22px 65px #153c7020}
.za-brand{font-size:23px;font-weight:950;color:#123d7b;letter-spacing:-.5px}.za-muted{font-size:12px;color:#718096;line-height:1.6}
.za-field{display:grid;gap:7px;margin:13px 0}.za-field label{font-size:12px;font-weight:800;color:#475569}.za-field input,.za-field select,.za-field textarea{width:100%;border:1px solid #dbe4f0;border-radius:11px;padding:12px;background:#fff;font:inherit;color:#17243b;outline:none}.za-field input:focus,.za-field textarea:focus{border-color:#3182ce;box-shadow:0 0 0 3px #3182ce18}
.za-primary,.za-secondary,.za-danger{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.za-primary{background:linear-gradient(135deg,#1556b8,#2788ed);color:white}.za-secondary{background:#eaf2ff;color:#1556a8}.za-danger{background:#fff0f0;color:#c03939}.za-full{width:100%}
.za-top{height:66px;background:#fff;border-bottom:1px solid #e5ebf3;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:3}.za-top strong{font-size:17px;color:#123d7b}.za-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100% - 66px)}
.za-side{background:#102f60;padding:18px 12px;color:#fff}.za-side small{display:block;color:#a9c8f5;font-size:10px;font-weight:900;letter-spacing:1.4px;padding:10px 12px}.za-nav{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;color:#dbeafe;border:0;padding:11px 12px;border-radius:10px;margin:2px 0;font-weight:750;font-size:12px;cursor:pointer}.za-nav.active,.za-nav:hover{background:#ffffff20;color:#fff}.za-main{padding:22px;max-width:1400px;width:100%;margin:auto}.za-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.za-heading h2{margin:0 0 5px;font-size:23px;color:#152d50}.za-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:18px}.za-stat,.za-card{background:#fff;border:1px solid #e5ebf3;border-radius:16px;padding:16px;box-shadow:0 4px 14px #1d3b6610}.za-stat span{font-size:11px;color:#718096;font-weight:800}.za-stat b{display:block;font-size:24px;color:#143e7b;margin-top:7px}.za-card h3{font-size:14px;margin:0 0 12px;color:#1d3558}.za-card p{font-size:12px;color:#718096;line-height:1.6}.za-actions{display:flex;gap:8px;flex-wrap:wrap}.za-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #edf1f6;padding:11px 0;font-size:12px}.za-row:first-of-type{border-top:0}.za-chip{font-size:10px;font-weight:900;border-radius:99px;padding:5px 8px;background:#eaf2ff;color:#1556a8}.za-chip.warn{background:#fff4dc;color:#a56700}.za-chip.good{background:#e8f8ef;color:#16804a}.za-formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.za-formgrid .wide{grid-column:1/-1}.za-notice{border:1px solid #f2d89b;background:#fff9e9;color:#795619;border-radius:12px;padding:11px 13px;font-size:11px;line-height:1.55;margin-bottom:16px}.za-empty{padding:20px;text-align:center;color:#8a97a9;font-size:12px}.za-mobile-nav{display:none}
@media(max-width:760px){.za-layout{display:block}.za-side{display:none}.za-main{padding:14px 12px 90px}.za-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.za-stat{padding:12px}.za-stat b{font-size:20px}.za-heading h2{font-size:19px}.za-mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:9px;background:#fff;border-bottom:1px solid #e5ebf3;position:sticky;top:66px;z-index:2}.za-mobile-nav .za-nav{white-space:nowrap;width:auto;flex:0 0 auto;background:#eff5ff;color:#174b91;padding:9px 11px}.za-mobile-nav .za-nav.active{background:#155dbd;color:#fff}.za-formgrid{grid-template-columns:1fr}.za-formgrid .wide{grid-column:auto}.za-top{padding:0 12px}.za-top strong{font-size:15px}}
</style>
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}</style></head><body>
<button id="zenAdminLauncher" type="button" onclick="zenAdminOpenLogin()">⚙ Admin Panel</button>
<div id="zenAdminShell" aria-hidden="true">
  <div id="zaLoginView" class="za-login-wrap">
    <div class="za-login">
      <div class="za-brand">Zenvixo <span style="color:#2584e8">Admin</span></div>
      <p class="za-muted">Administrator sign in</p>
      <form id="zaLoginForm">
        <div class="za-field"><label>ADMIN PASSWORD</label><input id="zaPassword" type="password" placeholder="Enter admin password" autocomplete="current-password" required></div>
        <button class="za-primary za-full" type="submit">Login to Admin Panel</button>
      </form>
      <p id="zaLoginError" style="display:none;color:#c03939;font-size:12px;font-weight:700">Incorrect password. Try again.</p>
      <p class="za-muted" style="margin:16px 0 0"></p>
      <button class="za-secondary za-full" style="margin-top:12px" onclick="zenAdminClose()" type="button">Back to Website</button>
    </div>
  </div>
  <div id="zaDashboardView" style="display:none">
    <header class="za-top"><strong>⚙ Zenvixo Admin Panel</strong><div class="za-actions"><button class="za-danger" onclick="zenAdminLogout()">Logout</button></div></header>
    <div class="za-mobile-nav" id="zaMobileNav"></div>
    <div class="za-layout"><aside class="za-side"><small>CONTROL MENU</small><div id="zaSideNav"></div></aside><main class="za-main" id="zaMain"></main></div>
  </div>
</div>
<script id="zen-admin-script">
(function(){
 const API='api/payment-methods.php';
 const storeKey='zenvixo_admin_demo_v1';
 // Strip legacy demo payment numbers so no number appears until admin sets a real one.
 try { const saved=JSON.parse(localStorage.getItem('bajiPaymentMethods')||'[]'); const old=['01540730513','01841234567','01345678901','01712345678','0x7F...8A9B']; let changed=false; const clean=saved.map(m=>{if(old.includes(String(m.number||'').trim())){changed=true;return {...m,number:''};}return m;}); if(changed)localStorage.setItem('bajiPaymentMethods',JSON.stringify(clean)); } catch(e) {}
 const menus=[['overview','▦','Overview'],['banners','▧','Banner Control'],['balance','৳','Balance Control'],['users','♙','User Management'],['reviews','★','Review System'],['ranking','🏆','Ranking Control'],['tutorial','▶','Tutorials'],['plans','▣','My Plan Control'],['tasks','◷','Daily Task Control'],['packages','◇','Package Control'],['deposit','↓','Deposit Requests'],['withdraw','↑','Withdraw Requests'],['referral','♧','Refer & Earn'],['payment-methods','💳','Payment Methods']];
 let active='overview', data={};
 try{data=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){data={}}
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function save(){try{localStorage.setItem(storeKey,JSON.stringify(data))}catch(e){alert('Browser storage is full.')}}
 function list(k){return Array.isArray(data[k])?data[k]:[]}
 function add(k,obj){data[k]=list(k);data[k].unshift({...obj,id:Date.now()+Math.random()});save();render()}
 function nav(){const markup=menus.map(([id,ic,n])=>`<button class="za-nav ${active===id?'active':''}" data-nav="${id}"><span>${ic}</span>${n}</button>`).join('');$('zaSideNav').innerHTML=markup;$('zaMobileNav').innerHTML=markup}
 function field(label,name,placeholder='',type='text',wide=false){return `<div class="za-field ${wide?'wide':''}"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${type==='number'?'step="any"':''}></div>`}
 function select(label,name,opts,wide=false){return `<div class="za-field ${wide?'wide':''}"><label>${label}</label><select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`}
 function card(title,body){return `<section class="za-card"><h3>${title}</h3>${body}</section>`}
 function form(title,fields,button='Save Changes',hint=''){return card(title,`${hint?`<p>${hint}</p>`:''}<form class="za-formgrid" data-demo-form>${fields}<div class="wide"><button class="za-primary" type="submit">${button}</button></div></form>`)}
 function rows(k,empty='No records yet'){const a=list(k);return a.length?a.map((x,i)=>`<div class="za-row"><div><b>${esc(x.name||x.title||x.user||x.label||'Record')}</b><div style="color:#7b8798;margin-top:4px">${esc(x.detail||x.amount||x.note||x.status||'')}</div></div><div class="za-actions"><span class="za-chip">${esc(x.status||'Saved')}</span><button class="za-danger" data-delete="${k}" data-index="${i}">Delete</button></div></div>`).join(''):`<div class="za-empty">${empty}</div>`}
 function section(title,desc,body){return `<div class="za-heading"><div><h2>${title}</h2><div class="za-muted">${desc}</div></div></div>${body}`}
 function render(){nav();let out=''; if(active==='payment-methods'&&!window.__paymentFetchInFlight){window.__paymentFetchInFlight=true;fetch(API,{cache:'no-store'}).then(r=>r.json()).then(x=>{window.__serverPaymentMethods=Array.isArray(x)?x:[];window.__paymentFetchInFlight=false;if(active==='payment-methods')render()}).catch(()=>{window.__paymentFetchInFlight=false})}
 switch(active){
 case'overview':out=section('Dashboard Overview','Your website control center',`<div class="za-notice"><b>Important:</b> </div><div class="za-grid">${[['Banners',list('banners').length],['Reviews',list('reviews').length],['Ranking Entries',list('ranking').length],['Tutorials',list('tutorial').length],['Packages',list('packages').length],['Requests',list('requests').length]].map(([a,b])=>`<div class="za-stat"><span>${a}</span><b>${b}</b></div>`).join('')}</div>${card('Quick Actions',`<div class="za-actions"><button class="za-primary" data-goto="users">Manage Users</button><button class="za-secondary" data-goto="deposit">Deposit Requests</button><button class="za-secondary" data-goto="withdraw">Withdraw Requests</button></div>`)}${card('Recent Activity',rows('activity'))}`);break;
 case'banners':out=section('Banner Control','Manage the three homepage banner slots',`${form('Update Banner',select('Banner Slot','slot',['Banner 1','Banner 2','Banner 3'])+field('Banner Title','title','Enter banner title')+field('Image URL','image','https://...','url')+field('Button Link (optional)','link','https://...','url'),'Save Banner','Upload or link the replacement banner image.')} ${card('Saved Banner Changes',rows('banners'))}`);break;
 case'balance':out=section('Balance Control','Add, reduce or set a user balance',`${form('Adjust User Balance',field('User phone / ID','user','Enter user phone or ID')+field('Amount (BDT)','amount','0','number')+select('Action','action',['Add Balance','Reduce Balance','Set Balance'])+field('Reason','detail','Adjustment note'),'Apply Balance Change','')} ${card('Balance Adjustment History',rows('balance'))}`);break;
 case'users':out=section('User Management','Find a user and manage account status',`${form('User Account Action',field('User phone / ID','user','Enter user phone or ID')+select('Action','action',['Ban User','Unban User','Remove Ban'])+field('Reason','detail','Reason (optional)'),'Save User Action')} ${card('User Actions',rows('users'))}`);break;
 case'reviews':out=section('Review System','Add clearly admin-published reviews or remove reviews',`${form('Add Admin Review',field('Display Name','name','Reviewer name')+field('Profile Picture URL','image','https://...','url')+select('Rating','rating',['5 Stars','4 Stars','3 Stars','2 Stars','1 Star'])+`<div class="za-field wide"><label>Review Text</label><textarea name="detail" placeholder="Write review..." rows="3"></textarea></div>`,'Publish Review','Admin-created reviews should be labelled as admin/promo content, not presented as genuine customer testimonials.')} ${card('Published Reviews',rows('reviews'))}`);break;
 case'ranking':out=section('Ranking Control','Set leaderboard slots and arrange entries',`${form('Ranking Settings',field('Number of Slots','slots','e.g. 20','number')+select('Sort Mode','sort',['Manual Order','Amount: High to Low','Amount: Low to High']),'Save Ranking Settings')} ${form('Add / Edit Ranking Entry',field('Display Name','name','Name')+field('Profile Picture URL','image','https://...','url')+field('Displayed Amount (BDT)','amount','0','number')+field('Position','position','1','number'),'Add to Ranking','Entries can be reordered or deleted below.')} ${card('Ranking Entries',rows('ranking'))}`);break;
 case'tutorial':out=section('Tutorial Control','Add tutorial video details for the website',`${form('Add Tutorial',field('Video Title','title','Tutorial title')+field('Video URL','link','YouTube / MP4 URL','url')+field('Thumbnail URL','image','https://...','url')+field('Description','detail','Short description'),'Add Tutorial','Add a video URL. Direct video file hosting can be configured later.')} ${card('Tutorial List',rows('tutorial'))}`);break;
 case'plans':out=section('My Plan Control','Adjust, extend, remove or reassign a user plan',`${form('User Plan Action',field('User phone / ID','user','User phone or ID')+field('Plan Name','name','Plan name')+field('Days to add / remove','days','Number of days','number')+select('Action','action',['Assign Plan','Extend Plan','Reduce Time','Remove Plan']),'Apply Plan Action')} ${card('Plan Actions',rows('plans'))}`);break;
 case'tasks':out=section('Daily Task Control','প্রতিটি প্যাকেজের জন্য আলাদা দৈনিক ভিডিও টাস্ক ও লিংক সেট করুন। তারিখ অনুযায়ী সেটিং কার্যকর হবে।',`${form('Package-wise Daily Task',select('Select Package','planId',['plan_3000 — ৩,০০০ টাকা','plan_6000 — ৬,০০০ টাকা','plan_10000 — ১০,০০০ টাকা','plan_15000 — ১৫,০০০ টাকা','plan_20000 — ২০,০০০ টাকা','plan_30000 — ৩০,০০০ টাকা','plan_50000 — ৫০,০০০ টাকা'])+field('Task Number / Slot (1–30)','slot','যেমন 1','number')+field('Task / Video Title','title','ভিডিওর নাম')+field('Video Link','link','https://...','url')+field('Watch Time (seconds)','time','যেমন 60','number')+field('Reward (BDT)','amount','যেমন 10','number')+field('Task Date','taskDate','YYYY-MM-DD','date')+select('Status','status',['Active','Paused']),'Save Daily Task','প্রতিটি প্যাকেজের টাস্ক আলাদা। নির্দিষ্ট তারিখে ওই প্যাকেজের নির্বাচিত স্লটের ভিডিও লিংক, সময় ও রিওয়ার্ড বদলাবে।')} ${card('Saved Daily Package Tasks',rows('dailyTasks'))}`);break;
 case'packages':out=section('Package Control','Manage package prices, offers, cashback and package boards',`${form('Add / Update Package',field('Package Name','name','Package name')+field('Price (BDT)','price','0','number')+field('Offer Price (BDT)','offer','Optional','number')+field('Cashback (BDT)','cashback','0','number')+field('Duration (days)','days','30','number')+select('Status','status',['Active','Hidden','Offer Active']),'Save Package')} ${card('Packages',rows('packages'))}`);break;
 case'deposit':case'withdraw':{let kind=active==='deposit'?'Deposit':'Withdraw';out=section(`${kind} Requests`,`Review ${kind.toLowerCase()} requests`,`${form(`${kind} Request Action`,field('User phone / ID','user','User phone or ID')+field('Amount (BDT)','amount','0','number')+field('Payment Number / Details','detail','Account or transaction details')+select('Decision','status',['Pending','Accepted','Rejected','Deleted']),'Save Request Decision')} ${card(`${kind} Request History`,rows(active))}`);break;}
 case'payment-methods':{let current=window.__serverPaymentMethods||[];const methodOpts=['nogod','rocket','upay','bkash','binance'];out=section('Payment Method Settings','Change deposit/withdraw account numbers and payment logos. Changes are saved to the website database and shared with all visitors.',`${form('Add / Update Payment Method',select('Method ID','methodId',methodOpts)+field('Display Name','name','e.g. bKash')+field('Account Number / Wallet','number','01XXXXXXXXX')+field('Logo Image URL','logoUrl','https://...','url')+field('Fallback Icon / Emoji','icon','💳'),'Save Payment Method','Use a direct image URL for the logo, or an emoji fallback.')} ${card('Current Payment Methods',current.length?current.map(m=>`<div class="za-row"><div><b>${esc(m.name||m.id)}</b><div>${esc((m.number||'').trim() ? m.number : 'নাম্বার সেট করা হয়নি')}</div>${m.logoUrl?`<img src="${esc(m.logoUrl)}" alt="logo" style="width:38px;height:38px;object-fit:contain;margin-top:6px">`:''}</div><span class="za-chip">${esc(m.id)}</span></div>`).join(''):'No saved methods yet')}`);break;}
 case'referral':out=section('Refer & Earn Control','Set referral rewards and adjust a user referral count',`${form('Global Referral Settings',field('Reward Coins','coins','0','number')+field('Reward Amount (BDT)','amount','0','number')+field('Per Referral Bonus','bonus','0','number'),'Save Referral Settings')} ${form('User Referral Adjustment',field('User phone / ID','user','User phone or ID')+field('Referral Count to Add / Remove','count','0','number')+select('Action','action',['Add Referrals','Remove Referrals','Set Referral Count']),'Apply Referral Change')} ${card('Referral Adjustments',rows('referral'))}`);break;
 }
 $('zaMain').innerHTML=out;
 }
 window.zenAdminOpenLogin=()=>{$('zenAdminShell').style.display='block';$('zenAdminShell').setAttribute('aria-hidden','false');$('zaLoginView').style.display='grid';$('zaDashboardView').style.display='none';$('zaPassword').value='';$('zaLoginError').style.display='none'};
 window.zenAdminClose=()=>{$('zenAdminShell').style.display='none';$('zenAdminShell').setAttribute('aria-hidden','true')};
 window.zenAdminLogout=()=>{fetch('api/admin-logout.php',{method:'POST'}).finally(()=>zenAdminOpenLogin())};
 $('zaLoginForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('api/admin-login.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('zaPassword').value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error();$('zaLoginView').style.display='none';$('zaDashboardView').style.display='block';active='overview';render()}catch(err){$('zaLoginError').style.display='block'}});
 $('zenAdminShell').addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){active=n.dataset.nav;render();return}const g=e.target.closest('[data-goto]');if(g){active=g.dataset.goto;render();return}const d=e.target.closest('[data-delete]');if(d){const k=d.dataset.delete,i=Number(d.dataset.index),record=list(k)[i];data[k]=list(k).filter((_,x)=>x!==i);if(k==='dailyTasks'&&record){try{const daily=JSON.parse(localStorage.getItem('zenvixoDailyPlanTasks')||'{}');const arr=daily[record.taskDate]?.[record.planId]||[];daily[record.taskDate][record.planId]=arr.filter(x=>!(Number(x.slot)===Number(record.slot)));localStorage.setItem('zenvixoDailyPlanTasks',JSON.stringify(daily));}catch(err){}}save();render();return}});
 $('zenAdminShell').addEventListener('submit',e=>{const f=e.target.closest('[data-demo-form]');if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f).entries());if(active==='payment-methods'){const id=String(v.methodId||'').toLowerCase();if(!id||!v.name){alert('পেমেন্ট মেথড ও নাম দিন।');return}fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:v.name.trim(),number:(v.number||'').trim(),logoUrl:(v.logoUrl||'').trim(),icon:(v.icon||'💳').trim()})}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Save failed');window.__serverPaymentMethods=j.methods||[];f.reset();render();alert('সার্ভার ডেটাবেজে সেভ হয়েছে। সব ইউজার আপডেটেড নাম্বার দেখবে।')}).catch(err=>alert('সেভ হয়নি: '+err.message));return;}let k=active;if(active==='deposit'||active==='withdraw')k=active;else if(active==='users')k='users';else if(active==='plans')k='plans';else if(active==='referral')k='referral';else if(active==='balance')k='balance';else if(active==='banners')k='banners';else if(active==='reviews')k='reviews';else if(active==='ranking')k='ranking';else if(active==='tutorial')k='tutorial';else if(active==='tasks')k='tasks';else if(active==='packages')k='packages';
 if(active==='tasks'){
   const planIds=['plan_3000','plan_6000','plan_10000','plan_15000','plan_20000','plan_30000','plan_50000'];
   const slot=Number(v.slot), planId=String(v.planId||'').split(' ')[0], date=String(v.taskDate||'');
   if(!planIds.includes(planId)){alert('একটি সঠিক প্যাকেজ নির্বাচন করুন।');return}
   if(!Number.isInteger(slot)||slot<1||slot>30){alert('Task slot 1 থেকে 30-এর মধ্যে দিন।');return}
   if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('সঠিক তারিখ নির্বাচন করুন।');return}
   let daily={};try{daily=JSON.parse(localStorage.getItem('zenvixoDailyPlanTasks')||'{}')}catch(e){}
   daily[date]=daily[date]||{};daily[date][planId]=daily[date][planId]||[];
   const item={...v,planId,slot};
   const at=daily[date][planId].findIndex(x=>Number(x.slot)===slot);
   if(at>=0)daily[date][planId][at]=item;else daily[date][planId].push(item);
   localStorage.setItem('zenvixoDailyPlanTasks',JSON.stringify(daily));
   data.dailyTasks=list('dailyTasks').filter(x=>!(x.taskDate===date&&x.planId===planId&&Number(x.slot)===slot));
   data.dailyTasks.unshift({...item,name:planId+' · Task '+slot,detail:date+' · '+(item.title||'Video')+' · '+(item.status||'Active')});save();f.reset();render();alert('এই প্যাকেজের নির্দিষ্ট তারিখের Daily Task সেভ হয়েছে।');return;
 }
